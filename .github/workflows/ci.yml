name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Deploy smoke tests skip themselves without DEICM_URL; slow cases are excluded by addopts.
      - run: uv run --extra web pytest -q
