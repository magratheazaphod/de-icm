[project]
name = "deicm"
version = "0.1.0"
description = "DE-ICM: near-exact Independent Chip Model placement probabilities and equities for fields of thousands of players"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jesse Day" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "anthropic>=0.70", "python-multipart>=0.0.9"]

[project.scripts]
deicm = "deicm.cli:main"
deicm-web = "deicm.web.app:main"

[dependency-groups]
dev = ["pytest>=8", "mpmath>=1.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deicm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: n = 2000 validation cases (run with: pytest -m slow)"]
